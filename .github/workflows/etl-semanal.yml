

name: ETL Semanal (ATT&CK, CTID, Sigma)

on:
  schedule:
    # Corre todos los domingos a las 06:00 UTC
    - cron: '0 6 * * 0'
  workflow_dispatch: # Permite ejecutarlo manualmente desde GitHub cuando quieras

jobs:
  ingesta-amenazas:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar dependencias del backend
        run: |
          pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Ejecutar ETL MITRE ATT&CK
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python backend/etl/ingest_mitre.py

      - name: Ejecutar ETL CTID (Mapeos NIST)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python backend/etl/ingest_ctid.py

      - name: Ejecutar ETL SigmaHQ
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python backend/etl/ingest_sigma.py

      